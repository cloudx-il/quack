<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>הברווז מושלם</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;800&family=Jost:wght@400;500&display=swap">
<style>
/* Layout: one phone screen - duck + speech bubble on top, a short feedback card below, owner-only results at the end */
:root{
  --bg:#0C0E14; --panel:#1C1F27; --panel2:#14161C; --line:rgba(22,184,196,.18);
  --fg:#FAF7F0; --muted:#A7B0BA; --cyan:#16B8C4; --coral:#E07A5F; --ok:#3DDC97; --glow:#123A40; --ink:#14161C;
  --f-body:'Assistant',Arial,sans-serif; --f-word:'Jost','Assistant',sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}[hidden]{display:none!important}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){--bg:#FAF7F0;--panel:#FFFFFF;--panel2:#F3EFE6;--line:#ECE7DC;--fg:#14161C;--muted:#5A636E;--cyan:#0E7C86;--coral:#B85A40;--ok:#1E8A5C;--glow:#DDF3F4;color-scheme:light}}
:root[data-theme="light"]{--bg:#FAF7F0;--panel:#FFFFFF;--panel2:#F3EFE6;--line:#ECE7DC;--fg:#14161C;--muted:#5A636E;--cyan:#0E7C86;--coral:#B85A40;--ok:#1E8A5C;--glow:#DDF3F4;color-scheme:light}
body{background:radial-gradient(900px 520px at 50% -8%,var(--glow) 0%,var(--bg) 62%) var(--bg);color:var(--fg);font-family:var(--f-body);font-size:17px;line-height:1.55;min-height:100%}
.wrap{max-width:520px;margin:0 auto;padding-block:28px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:22px;direction:rtl}
.brand{display:flex;align-items:center;justify-content:space-between;gap:10px;font-family:var(--f-word);color:var(--muted);font-size:13px;letter-spacing:.14em;direction:ltr}
.qlogo{height:30px;width:auto;color:var(--fg)}.by{font-family:var(--f-word);font-size:12px;letter-spacing:.06em;color:var(--muted)}.by b{color:var(--fg);font-weight:500}
.stage{display:flex;flex-direction:column;align-items:center;gap:6px}
.bubble{position:relative;background:var(--panel);border:2px solid var(--cyan);border-radius:22px;padding:14px 18px;font-weight:800;font-size:22px;line-height:1.3;text-align:center;max-width:420px;text-wrap:balance}
.bubble small{display:block;font-weight:600;font-size:15px;color:var(--muted);margin-top:6px}
.bubble::after{content:"";position:absolute;top:100%;left:50%;margin-left:-11px;border:11px solid transparent;border-top-color:var(--cyan)}
.duckbtn{background:none;border:0;padding:0;cursor:pointer;border-radius:50%;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.duckbtn:focus-visible{outline:3px solid var(--coral);outline-offset:6px}
.duckbtn img{width:min(230px,58vw);height:auto;max-height:46vh;object-fit:contain;display:block;filter:drop-shadow(0 14px 22px rgba(0,0,0,.45));user-select:none;-webkit-user-drag:none}
.hint{font-size:14px;color:var(--cyan);font-weight:600}
@media (prefers-reduced-motion:no-preference){
 .duckbtn img{animation:bob 3.2s ease-in-out infinite}
 .duckbtn.laugh img{animation:shake .14s linear 8}
 .bubble.pop{animation:pop .35s cubic-bezier(.2,1.6,.4,1)}
}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-8px) rotate(2deg)}}
@keyframes shake{0%,100%{transform:rotate(-6deg) translateY(-4px)}50%{transform:rotate(6deg) translateY(2px)}}
@keyframes pop{0%{transform:scale(.85)}100%{transform:none}}
.card{position:relative;overflow:hidden;background:linear-gradient(135deg,rgba(22,184,196,.08),transparent 55%),var(--panel);border:1px solid var(--line);border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:16px}
#fb::after{content:"";position:absolute;inset:0 0 auto 0;height:2px;background:linear-gradient(90deg,transparent,var(--cyan),transparent);opacity:.8}
@media (prefers-reduced-motion:no-preference){#fb::after{animation:scan 6.4s ease-in-out 1.2s 1 both}}
@keyframes scan{0%,100%{top:0}25%,75%{top:calc(100% - 2px)}50%{top:0}}
.sticker{position:absolute;top:18px;inset-inline-start:16px;font-weight:800;font-size:24px;letter-spacing:.12em;border:3px solid var(--ok);color:var(--ok);border-radius:8px;padding:2px 14px;transform:rotate(-10deg) scale(.6);opacity:0;pointer-events:none;transition:transform .3s cubic-bezier(.2,1.6,.4,1),opacity .2s}
#fb.stamped .sticker{opacity:1;transform:rotate(-10deg) scale(1)}
.card h2{margin:0;font-size:21px;font-weight:800;text-wrap:balance}
.card p.sub{margin:-8px 0 0;color:var(--muted);font-size:15px}
fieldset{border:0;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
legend,label.q{font-weight:700;font-size:16px;padding:0;margin-bottom:4px}
.rate{display:flex;gap:8px;direction:ltr;justify-content:flex-end}
.rate input{position:absolute;opacity:0;width:1px;height:1px}
.rate label{flex:1;max-width:64px;aspect-ratio:1;border-radius:14px;background:var(--panel2);border:1.5px solid var(--line);display:grid;place-items:center;cursor:pointer;font-family:var(--f-word);font-size:20px;color:var(--muted);transition:background .15s,border-color .15s,color .15s}
.rate label:hover{border-color:var(--cyan)}
.rate input:checked+label{background:var(--cyan);border-color:var(--cyan);color:var(--bg);font-weight:500}
.rate input:focus-visible+label{outline:2px solid var(--coral);outline-offset:2px}
.scale{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
textarea{font:inherit;font-size:16px;width:100%;min-height:84px;resize:vertical;background:var(--panel2);color:var(--fg);border:1.5px solid var(--line);border-radius:14px;padding:10px 12px}
textarea:focus-visible{outline:2px solid var(--cyan);outline-offset:1px}
textarea::placeholder{color:var(--muted);opacity:.8}
.send{font:inherit;font-weight:800;font-size:18px;border:0;border-radius:12px;padding:14px;background:var(--coral);color:var(--ink);cursor:pointer}
.send:disabled{opacity:.5;cursor:default}
.send:focus-visible{outline:2px solid var(--fg);outline-offset:3px}
.msg{margin:0;font-size:15px;font-weight:600}.msg.err{color:var(--coral)}.msg.ok{color:var(--ok)}
.res{border-color:rgba(224,122,95,.35)}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.kpis div{background:var(--panel2);border-radius:14px;padding:10px 12px}
.kpis b{display:block;font-family:var(--f-word);font-weight:500;font-size:28px;font-variant-numeric:tabular-nums}
.kpis span{font-size:13px;color:var(--muted)}
.list{display:flex;flex-direction:column;gap:10px;margin:0;padding:0;list-style:none}
.list li{background:var(--panel2);border-radius:14px;padding:10px 12px;font-size:15px;display:flex;flex-direction:column;gap:4px;min-width:0;overflow-wrap:anywhere}
.list li .r{font-family:var(--f-word);color:var(--cyan);font-size:14px}
.list li .t{color:var(--muted);font-size:13px}
.trap{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:radial-gradient(700px 520px at 50% 45%,var(--glow) 0%,var(--bg) 70%) var(--bg);padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px);transition:opacity .45s ease}
.trap.gone{opacity:0;pointer-events:none}
.giftbtn{background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation;border-radius:24px}
.giftbtn:focus-visible{outline:3px solid var(--coral);outline-offset:8px}
.giftbtn svg{width:min(260px,62vw);height:auto;display:block;overflow:visible}
.gift-lid,.gift-q{transform-box:fill-box;transform-origin:50% 100%}
@media (prefers-reduced-motion:no-preference){
 .giftbtn svg{animation:wob 1.6s ease-in-out infinite}
 .gift-q{animation:qbob 1.6s ease-in-out infinite}
 .trap.open .giftbtn svg{animation:none}
 .trap.open .gift-lid{transition:transform .45s cubic-bezier(.3,1.4,.5,1);transform:translate(40px,-150px) rotate(28deg)}
 .trap.open .gift-q{transition:transform .4s;transform:translateY(-60px) scale(1.6);opacity:0}
}
@keyframes wob{0%,100%{transform:rotate(0)}10%{transform:rotate(-6deg)}20%{transform:rotate(5deg)}30%{transform:rotate(-3deg)}40%{transform:rotate(0)}}
@keyframes qbob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
body.trapped{overflow:hidden}
.hero{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.eyebrow{margin:0;font-family:var(--f-word);font-size:13px;letter-spacing:.18em;color:var(--cyan);text-transform:uppercase}
.h1{margin:0;font-size:clamp(34px,10vw,52px);font-weight:800;line-height:1.05;display:flex;flex-direction:column;align-items:center;gap:2px;text-wrap:balance}
.h1 .ask{display:none}
.strike{position:relative;color:var(--muted)}
.strike::after{content:"";position:absolute;inset-inline:-4px;top:54%;height:6px;border-radius:3px;background:var(--coral);transform:scaleX(0);transform-origin:right}
.perfect{color:var(--cyan);opacity:0;transform:translateY(10px) scale(.9)}
.hero.go .strike::after{transform:scaleX(1);transition:transform .45s ease .35s}
.hero.go .perfect{opacity:1;transform:none;transition:opacity .35s ease .9s,transform .5s cubic-bezier(.2,1.6,.4,1) .9s}
@media (prefers-reduced-motion:reduce){.hero .strike::after{transform:scaleX(1)}.hero .perfect{opacity:1;transform:none}}
.rate label{flex-direction:column;gap:0;padding-top:4px}
.rate label svg{width:30px;height:30px}.rate label .body{fill:var(--panel);stroke:var(--muted);stroke-width:2}.rate label .eye{fill:var(--muted)}.rate label .beak{fill:var(--muted)}
.rate label b{font-size:12px;font-weight:500}
.rate label.on .body{fill:var(--cyan);stroke:var(--cyan)}.rate label.on .eye{fill:var(--bg)}.rate label.on .beak{fill:var(--coral)}.rate label.on{border-color:var(--cyan);color:var(--fg)}
.rate input:checked+label{background:var(--panel2);color:var(--fg)}
@media (prefers-reduced-motion:no-preference){.rate label.on svg{animation:hop .35s cubic-bezier(.2,1.6,.4,1)}}
@keyframes hop{40%{transform:translateY(-6px) rotate(-8deg)}}
.ratesay{margin:2px 0 0;min-height:1.4em;font-weight:700;color:var(--coral);font-size:15px}
#fx{position:fixed;inset:0;pointer-events:none;z-index:60}
.again{align-self:center;font:inherit;font-size:13px;color:var(--muted);background:none;border:0;text-decoration:underline;cursor:pointer;padding:4px}
.again:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.credits{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}.tag{margin:0;font-size:20px;font-weight:800;color:var(--fg)}.names{margin:0;font-size:14px;color:var(--muted)}
.foot{text-align:center;color:var(--muted);font-size:13px;font-family:var(--f-word);letter-spacing:.08em;direction:ltr}
</style>
</head>

<div class="trap" id="trap"><button class="giftbtn" id="gift" type="button" aria-label="הפתעה. לחצו כדי לפתוח">
<svg viewBox="0 0 240 260" aria-hidden="true">
 <g class="gift-q"><text x="120" y="52" text-anchor="middle" font-family="Jost,Assistant,sans-serif" font-size="64" font-weight="500" fill="#E07A5F">?</text></g>
 <rect x="40" y="128" width="160" height="118" rx="14" fill="#16B8C4"/>
 <rect x="40" y="128" width="160" height="22" fill="#0E8F99"/>

 <g class="gift-lid">
  <path d="M120 96 C96 64 64 72 76 92 C84 106 108 102 120 96 Z" fill="none" stroke="#E07A5F" stroke-width="10" stroke-linejoin="round"/>
  <path d="M120 96 C144 64 176 72 164 92 C156 106 132 102 120 96 Z" fill="none" stroke="#E07A5F" stroke-width="10" stroke-linejoin="round"/>

  <rect x="108" y="96" width="24" height="38" fill="#E07A5F"/>
 </g>
</svg></button></div>
<div class="wrap">
  <div class="brand"><svg class="qlogo" aria-label="Quack" viewBox="-16 -16 470 140"><g fill="none" stroke="currentColor" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"><circle cx="50" cy="50" r="42"/><path d="M70 74 L96 102"/><path d="M126 42 V72 Q126 100 154 100 Q182 100 182 72 V42 M182 42 V100"/><circle cx="242" cy="71" r="29"/><path d="M271 42 V100"/><path d="M352 49 A30 30 0 1 0 352 93"/><path d="M386 0 V100"/></g><path d="M432 42 L392 71 L432 100" fill="none" stroke="var(--coral)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/><circle cx="430" cy="6" r="12" fill="var(--cyan)"/></svg><span class="by">by <b>CloudX</b> · מבצע 007</span></div>

  <section class="hero" id="hero" aria-live="polite">
    <p class="eyebrow">קיבלנו משוב. ענינו בעצמנו</p>
    <h1 class="h1"><span class="ask">צריך להשתפר?</span> <span class="strike" id="strike">צריך להשתפר?</span><span class="perfect" id="perfect">אני מושלם.</span></h1>
  </section>
  <section class="stage">
    <div class="bubble" id="bubble">חחח. סליחה<small>אני רושם הכל. כמעט הכל</small></div>
    <button class="duckbtn" id="duck" type="button" aria-label="קלוד הברווז. לחיצה משמיעה צחוק"><img id="dimg" alt="" width="256" height="338"></button>
    <span class="hint" id="hint">לחצו על הברווז לעוד</span>
  </section>

  <section class="credits">
    <p class="tag">מהמייל לסיילספורס, בקוואק</p>

  </section>

  

  <p class="foot">QUACK BY CLOUDX</p>
  <button class="again" id="again" type="button">לפתוח שוב את ההפתעה</button>
</div>

function sizeFx(){fx.width=innerWidth*devicePixelRatio;fx.height=innerHeight*devicePixelRatio}sizeFx();addEventListener("resize",sizeFx);
function confetti(x,y,n){if(RM)return;const C=["#16B8C4","#E07A5F","#FAF7F0","#3DDC97"];for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,v=4+Math.random()*7;parts.push({x:x*devicePixelRatio,y:y*devicePixelRatio,vx:Math.cos(a)*v*devicePixelRatio,vy:(Math.sin(a)*v-6)*devicePixelRatio,s:(4+Math.random()*5)*devicePixelRatio,c:C[i%4],r:Math.random()*6,life:90+Math.random()*40})}if(!raf)tick()}
function tick(){cx.clearRect(0,0,fx.width,fx.height);parts=parts.filter(p=>p.life-->0);parts.forEach(p=>{p.vy+=.25*devicePixelRatio;p.x+=p.vx;p.y+=p.vy;p.r+=.15;cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;cx.globalAlpha=Math.min(1,p.life/30);cx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);cx.restore()});raf=parts.length?requestAnimationFrame(tick):0}
</script>
